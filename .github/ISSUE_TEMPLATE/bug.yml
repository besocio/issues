name: Bug
description: Report something that is broken in besocio
title: "[Bug]: "
labels: ["priority"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the bug with enough detail that someone else can reproduce it without a follow-up.

        Security bugs do not belong here. Report them at https://github.com/besocio/issues/security/advisories/new so the report stays private until a fix is published.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of besocio does this affect?
      options:
        - Auth
        - Profile
        - Feed
        - Social graph
        - Privacy
        - Moderation
        - Notifications
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps.
      placeholder: |
        1. Go to …
        2. Do …
        3. See …
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: Describe the outcome you expect.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens today?
      placeholder: Describe what you see, including any error text.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where you saw this. App version, browser or device, and account type if it matters.
      placeholder: Web, Chrome 131, production
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, logs, related tickets, or anything else that helps. Do not include passwords, tokens, or private user data.
      placeholder: Links, error messages, or notes.
    validations:
      required: false
