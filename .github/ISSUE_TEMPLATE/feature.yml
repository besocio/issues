name: Feature
description: Request a change or new behavior in besocio
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the change you want, who it is for, and how you would know it works.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of besocio does this affect?
      options:
        - Auth
        - Profile
        - Feed
        - Social graph
        - Privacy
        - Moderation
        - Notifications
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, and who runs into it?
      placeholder: People cannot …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should besocio do differently?
      placeholder: Add or change …
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways this could be solved, and why you prefer this one.
      placeholder: We could also …
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Mockups, examples, or related tickets. Do not include passwords, tokens, or private user data.
      placeholder: Links or notes.
    validations:
      required: false
