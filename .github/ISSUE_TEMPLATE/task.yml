name: Task
description: File a task for besocio
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the work, when it is done, and anything it depends on.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of besocio does this affect?
      options:
        - Auth
        - Profile
        - Feed
        - Social graph
        - Privacy
        - Moderation
        - Notifications
        - Other
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: Work
      description: What needs to be done?
      placeholder: Update, migrate, or check …
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How will someone know this task is finished?
      placeholder: This is done when …
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues, blockers, or work that has to happen first.
      placeholder: Blocked by #…
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Links or notes that help. Do not include passwords, tokens, or private user data.
      placeholder: Links or notes.
    validations:
      required: false
